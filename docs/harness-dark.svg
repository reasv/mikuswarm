<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 544" width="940" height="544" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">MikuSwarm harness</title>
  <desc id="d">A center chatroom timeline. Two @miku messages each fork off a disposable, parallel agent session that is handed a freshly constructed context (system prompt + chat context), reasons and runs tools on its own, then delivers a single reply back into the log.</desc>
  <style>
    text{ font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .t,.ta,.r,.s{ font-family: ui-monospace, "SF Mono", Menlo, "JetBrains Mono", monospace; font-size:12px; }
    .panel{ fill:#0d1117; stroke:#30363d; stroke-width:1.5; }
    .card{ fill:#161b22; stroke:#30363d; stroke-width:1.5; stroke-dasharray:5 4; }
    .band{ fill:#123230; }
    .h{ fill:#9198a1; font-weight:600; }
    .m{ fill:#e6edf3; }
    .hk{ fill:#39c5bb; font-weight:700; }
    .mk{ fill:#39c5bb; }
    .men{ fill:#39c5bb; font-weight:600; }
    .th{ fill:#6e7681; font-style:italic; }
    .t{ fill:#e6edf3; }
    .ta{ fill:#9198a1; }
    .r{ fill:#6e7681; }
    .s{ fill:#39c5bb; font-weight:600; }
    .fork{ stroke:#6e7681; stroke-width:1.5; fill:none; }
    .imgb{ fill:none; stroke:#30363d; stroke-width:1; }
    .flow{ stroke:#39c5bb; stroke-width:1.8; fill:none; }
    .sh{ font-family: ui-monospace, "SF Mono", Menlo, "JetBrains Mono", monospace; font-size:11px; }
    .shl{ fill:#6e7681; }
    .shi{ fill:#9198a1; font-weight:700; }
    .div{ stroke:#30363d; stroke-width:1; }
    .ctx{ fill:#0d1117; stroke:#30363d; stroke-width:1; }
    .cl{ fill:#9198a1; font-size:11px; font-weight:600; text-anchor:middle; }
  </style>
  <defs>
    <marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#6e7681"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#39c5bb"/>
    </marker>
    <clipPath id="imgclip"><rect x="430" y="405" width="56" height="56" rx="6"/></clipPath>
  </defs>

  <rect class="band" x="334" y="331" width="292" height="30" rx="6"/>
  <rect class="band" x="334" y="401" width="292" height="62" rx="6"/>

  <rect class="panel" x="334" y="40" width="292" height="478" rx="10"/>

  <path class="fork" d="M334,171 L280,171" marker-end="url(#af)"/>
  <path class="flow" d="M280,343 L342,343" marker-end="url(#aa)"/>
  <path class="fork" d="M626,239 L660,239" marker-end="url(#af)"/>
  <path class="flow" d="M660,411 L618,411" marker-end="url(#aa)"/>

  <rect class="card" x="30" y="56" width="250" height="302" rx="8"/>
  <text class="sh" x="46" y="80"><tspan class="shl">Session</tspan> <tspan class="shi">s-KB8dqsR77V</tspan></text>
  <line class="div" x1="46" y1="88" x2="264" y2="88"/>
  <rect class="ctx" x="46" y="98" width="218" height="30" rx="5"/>
  <text class="cl" x="155" y="117">system prompt</text>
  <rect class="ctx" x="46" y="134" width="218" height="30" rx="5"/>
  <text class="cl" x="155" y="153">chat context</text>
  <text class="th" x="46" y="188">is it down? check status</text>
  <text class="t"  x="46" y="219">web_search</text>
  <text class="ta" x="58" y="250">"openai api status"</text>
  <text class="t"  x="46" y="281">fetch status.openai.com</text>
  <text class="r"  x="46" y="312">→ 500s on /chat, 09:12 UTC</text>
  <text class="s"  x="46" y="347">send_message</text>

  <rect class="card" x="660" y="124" width="250" height="302" rx="8"/>
  <text class="sh" x="676" y="148"><tspan class="shl">Session</tspan> <tspan class="shi">s-L7FrBvmwtx</tspan></text>
  <line class="div" x1="676" y1="156" x2="894" y2="156"/>
  <rect class="ctx" x="676" y="166" width="218" height="30" rx="5"/>
  <text class="cl" x="785" y="185">system prompt</text>
  <rect class="ctx" x="676" y="202" width="218" height="30" rx="5"/>
  <text class="cl" x="785" y="221">chat context</text>
  <text class="th" x="676" y="256">it should look pathetic</text>
  <text class="t"  x="676" y="287">generate_image</text>
  <text class="ta" x="688" y="319">"robot crying at a</text>
  <text class="ta" x="688" y="350">terminal, 500 error"</text>
  <text class="r"  x="676" y="382">→ rendered 1024x1024</text>
  <text class="s"  x="676" y="415">send_message</text>

  <text class="h" x="350" y="74">luka</text><text class="m" x="430" y="74">requests timing out</text>
  <text class="h" x="350" y="108">kaito</text><text class="m" x="430" y="108">yeah since noon</text>
  <text class="h" x="350" y="142">neru</text><text class="m" x="430" y="142">ugh, build's red again</text>
  <text class="hk" x="350" y="176">teto</text><text x="430" y="176"><tspan class="men">@miku</tspan><tspan class="m"> is openai up</tspan></text>
  <text class="h" x="350" y="210">kaito</text><text class="m" x="430" y="210">same, ci's flaky today</text>
  <text class="hk" x="350" y="244">rin</text><text x="430" y="244"><tspan class="men">@miku</tspan><tspan class="m"> make a mascot</tspan></text>
  <text class="h" x="350" y="278">haku</text><text class="m" x="430" y="278">third time today</text>
  <text class="h" x="350" y="312">luka</text><text class="m" x="430" y="312">lol</text>
  <text class="hk" x="350" y="346">miku</text><text class="mk" x="430" y="346">status page: 500s</text>
  <text class="h" x="350" y="380">kaito</text><text class="m" x="430" y="380">called it lol</text>
  <text class="hk" x="350" y="414">miku</text>
  <image x="430" y="405" width="56" height="56" clip-path="url(#imgclip)" href="data:image/png;base64,"/>
  <rect class="imgb" x="430" y="405" width="56" height="56" rx="6"/>
  <text class="h" x="350" y="494">rin</text><text class="m" x="430" y="494">perfect</text>
</svg>
