[app]
name = "mikuswarm"
data_dir = "./var"
log_level = "info"
context_dump_dir = "./debug/context"

[agent]
disabled_tools = ["web_fetch", "web_search"]
# IANA time zone the agent operates in. Every date the agent sees is rendered in
# this zone (never the server's real zone), and it is exported as TZ to the
# process and the Docker sandbox. Set explicitly in local config.
timezone = "UTC"

# In-process observability console (read-only HTTP + SSE; spec/OBSERVABILITY-UI.md
# Part B). Off by default — enable it explicitly in local config and set an
# auth_token. Binds localhost; the console is for the operator, not end users.
[observability.server]
enabled = false
bind = "127.0.0.1"
port = 8799
# auth_token = "${MIKUSWARM_CONSOLE_TOKEN}"  # when set, required as a bearer token

[agent.sessions]
max_concurrent = 3
max_concurrent_dm = 1
max_queued_per_timeline = 10000
forced_completion_retries = 3
# max_tool_calls is intentionally unset → agent work is unbounded (the loop runs
# as long as the model emits tool calls). Set a number here only to impose a cap.

[agent.system]
fallback_prompt = "You are Miku, a helpful Matrix chat agent. Reply naturally and use NO_REPLY when no response is needed."

# Recovery — request- and session-level resilience.
# Layer 1 (implemented): transparent per-request retry for MECHANICAL LLM failures
# (connection reset, timeout, 5xx, 429). The exact same request is re-issued, with
# exponential backoff + full jitter, before the failure is allowed to surface — so a
# blip no longer discards a live session or burns a synthetic job's semantic-retry
# attempt. Failures that occur AFTER the stream has produced output are not replayed
# here (that is Layer-2 resume-in-place, not yet implemented).
[recovery]
llm_request_retries = 4            # additional attempts after the first (total = 5)
llm_request_backoff_base_ms = 500
llm_request_backoff_max_ms = 15000
# Layer 2 (spec §6.2): when a LIVE session's run dies mechanically after Layer 1
# exhausts, re-create the agent from the persisted snapshot + transcript and redo
# the exact same request (auto-resume, exponential backoff), then park it
# `failed-resumable` for a manual console resume. 0 disables auto-resume.
session_auto_resume_attempts = 2
session_auto_resume_backoff_ms = 5000

[models.default]
id = "claude-opus-4-7"
provider = "anthropic"
endpoint = "${ANTHROPIC_BASE_URL}"
api_key = "${LLM_API_KEY}"
multimodal = true
max_tokens = 16384
reasoning = true
context_window = 128000
# Cap on the base64-encoded image payload shipped to the provider (not raw
# bytes; raw inflates ~4/3 in base64). 5 MB ≈ 3.75 MB raw, under Anthropic's
# per-image inline cap.
image_input_bytes = 5242880

[models.default.cost]
input = 0
output = 0
cache_read = 0
cache_write = 0

[models.default.compat]
supports_cache_control_on_tools = false
supports_long_cache_retention = false

[context.tiers]
rich_target_tokens = 4000
rich_max_tokens = 8000
compact_target_tokens = 16000
compact_max_tokens = 24000

[media]
download_size_limit = 1073741824

[media.image]
max_total_pixels = 921600
max_total_pixels_hard = 1843200
min_shortest_side = 480
max_bytes = 1048576
mozjpeg = true

[media.video]
max_resolution = 480
max_bytes = 52428800
max_duration_seconds = 120
gpu_acceleration = false
x264_preset = "veryfast"
cache_max_bytes = 21474836480
cache_target_bytes = 16106127360

[media.audio]
max_bytes = 20971520
max_duration_seconds = 300

[storage]
database_path = "./var/mikuswarm.db"

[workspace]
root_dir = "./workspaces/miku"

# Docker sandbox (ARCHITECTURE.md §11a). Off by default; when enabled, the `bash`
# tool and `search_files`/ripgrep run inside a long-lived container with the
# workspace bind-mounted at workspace_mount. Enabling requires the image built
# (docker/build-sandbox.sh) and Docker reachable, or startup fails fast.
[sandbox]
enabled = false
image = "mikuswarm-sandbox:24.04"
container_name = "mikuswarm-sandbox"
network = "mikuswarm-sandbox"
workspace_mount = "/workspace"
exec_timeout_ms = 120000      # default per-command timeout (overridable per bash call)
max_output_bytes = 1048576    # cap on captured stdout/stderr per stream
stop_on_shutdown = false      # leave the container running across restarts

[timeline]
# Channel lifecycle: a timeline is inactive until first triggered. On the first
# trigger the bot backfills recent history before the activating session runs.
initial_backfill_messages = 200       # messages to fetch (0 = no backfill)
initial_backfill_window_ms = 3600000  # 1h of history before the trigger (the activation moment); whichever limit is reached first
initial_backfill_timeout_ms = 30000   # 30s; the first trigger is held this long
initial_backfill_page_size = 100      # messages per backward page request (clamped 1–1000)
inactive_event_retention_days = 0     # 0 = no pruning; >0 prunes old inactive-timeline events
# Undecryptable (UTD) event handling (issue #11).
initial_backfill_utd_halt_threshold = 50  # stop paging after N consecutive UTD events (0 = off)
redecryption_sweep_interval_ms = 60000    # retry stored UTD events every 60s (0 = sweeper off)
redecryption_sweep_batch = 50             # max UTD events probed per sweep tick

[matrix]
enabled = false
trigger_hold_ms = 2000
trigger_group_lookback_ms = 20000

[enrichment]
trigger_wait_timeout_ms = 30000

# Per-host HTTP egress limiting (spec Design D), enforced at the guardedFetch
# chokepoint and keyed per host (shared across all callers). This is NOT a
# cross-domain cap (the old enrichment.fetch_concurrency cap of 6 is removed): each
# host gets a generous admission cap, with a high global backstop and unconditional
# 429/503 + Retry-After backoff. Danbooru is deliberately NOT configured here — it
# owns an internal limiter in its tool ([danbooru].min_request_interval_ms / max_in_flight).
[rate_limits.http]
default_max_in_flight_per_host = 8   # generous per-host guard, not across domains
global_ceiling_max_in_flight = 256   # pure degenerate backstop (many-channels); far above normal load
backoff_base_ms = 500                # 429/Retry-After backoff is always on; these tune it
backoff_max_ms = 30000

# LLM request scheduling (spec Design A, src/agent/scheduler.ts). One admission
# queue per rate-limit GROUP (= one shared upstream budget); requests are served
# by priority class (interactive > proactive > background > background_low, from
# the session type / workload), FIFO within a class. `max_in_flight` is the only
# lever: outstanding requests held by the group — SMALL for a scarce budget so
# the upstream queue stays shallow and local priority is meaningful; raise it for
# a generous budget. There is deliberately NO max_rpm (an idle budget is never
# slowed); 429/503 backoff is unconditional in code, the knobs below only tune it.
# Everything (all agent session types, image_generate, captioning, remote
# embedding) lands in `default` unless its model block sets `rate_limit_group` to
# another group declared here — e.g. captioning on a separate OpenRouter budget:
#   [rate_limits.llm.openrouter]
#   max_in_flight = 16
#   [captioning.model]
#   rate_limit_group = "openrouter"
[rate_limits.llm.default]
max_in_flight = 2
backoff_base_ms = 1000
backoff_max_ms = 60000

[network]
# App-layer SSRF guard (defense-in-depth). When true, outbound fetches from
# caller-supplied URLs (web_fetch, media downloads, image references, …) resolve
# DNS and block private/loopback/link-local/metadata addresses, re-validating
# every redirect hop. This is the only egress protection on a bare-metal `tsx`
# run, so it defaults ON. Disable (false) ONLY where the container/network
# firewall already blocks private egress — the Compose deployment does this via
# docker/egress-rules.sh and flips this off in docker/95-docker.toml.
ssrf_guard = true
# Optional outbound HTTP(S) proxy for all tool fetches (leave unset for none).
# http_proxy_url = "http://proxy.internal:8080"

[captioning]
worker_count = 2
caption_all = false
caption_assistant_messages = false
trigger_wait_timeout_ms = 45000
max_retries = 2

[captioning.model]
id = "google/gemini-3.5-flash"
endpoint = "${OPENROUTER_BASE_URL}"
api_key = "${LLM_API_KEY}"

[captioning.image]
prompt = "Describe the image."
max_chars = 500
concurrency = 2

[captioning.video]
prompt = "Describe the video."
max_chars = 500
concurrency = 1
timeout_ms = 120000

[captioning.audio]
prompt = "Transcribe and describe the audio."
max_chars = 2000
concurrency = 1
timeout_ms = 60000

[sillytavern]
output_subdir = "cards/sillytavern"
export_subdir = "exports/sillytavern"
default_excerpt_chars = 2000
max_excerpt_chars = 4000
max_summary_entries = 20

[user_profiles]
root_dir = "users"
default_excerpt_chars = 1600
max_excerpt_chars = 6000
# When false, explicit cross-user targets (e.g. `user_profile_read` with a
# target.senderId that differs from the trigger sender) are rejected. Default
# true preserves the existing behavior — the agent can record notes about
# other room members on the requester's behalf.
allow_cross_user_targets = true

[danbooru]
base_url = "https://danbooru.donmai.us"
max_regular_tags = 2
default_limit = 20
download_subdir = "downloads/danbooru"

# Image generation / editing via Google's Gemini "nano banana" models.
# `base_url` is the Gemini API endpoint ROOT — the tool appends
# /v1beta/models/<model>:generateContent. This is the Google/Gemini API base
# (GEMINI_BASE_URL), distinct from the Anthropic model endpoint. `api_key` is
# sent as `Authorization: Bearer`.
[image_gen]
base_url = "${GEMINI_BASE_URL}"
api_key = "${LLM_API_KEY}"
timeout_ms = 120000
# Mandatory and high: Gemini emits the image AS output tokens (~1290 for 1K).
# Many gateways default this cap low, truncating before any image is emitted.
max_output_tokens = 32768
output_subdir = "generated-images"

[image_gen.models]
pro = "gemini-3-pro-image"
flash = "gemini-3.1-flash-image"

[summarization]
enabled = true
worker_count = 1
generation_threshold_tokens = 6000
leaf_input_tokens = 4000
leaf_target_tokens = 600
condense_fanout = 5
condense_target_tokens = 800
summary_max_overage_factor = 2.5
max_retries = 2
label_cache_ttl_ms = 600000

# Diary memory (ARCHITECTURE.md §9c). The agent's durable, first-person journal of
# its own participation, written automatically from each level-1 summary range and
# surfaced back into chat sessions (§10a). When disabled the worker simply doesn't
# drain — level-1 summaries still queue `diary_status='pending'` and flush if it is
# re-enabled later (no backfill machinery).
[diary]
enabled = true
worker_count = 1                  # like summarization; diary is not latency-critical.
max_retries = 3                   # a lost diary entry is acceptable, so an extra retry is a cheap hedge.
per_session_budget_tokens = 1200  # new-section cap = 1/5 of generation_threshold_tokens (6000).
recency_max_tokens = 6000         # token ceiling for the recent-memory window (§9a/§10a).
recency_file_count = 2            # N most recent EXISTING day files at/before the anchor (§9a).

# Memory retrieval (ARCHITECTURE.md §9d). Hybrid lexical+semantic search over
# memory/*.md: the recall_memory tool, and auto-retrieval of relevant past entries
# injected per trigger. Phase 1 (lexical FTS5/BM25) needs no external deps; the
# semantic half uses a small in-process embedding model (or a configured remote
# endpoint). Disable the whole subsystem by setting enabled = false.
[retrieval]
enabled = true
auto_retrieval = true             # §8c — inject the small relevant-memory block per trigger

[retrieval.index]
worker_count = 1                  # embedding worker pool (not latency-critical)
max_retries = 3
embed_batch_size = 32             # chunks per remote /embeddings call
max_chunk_tokens = 512            # oversized header blocks above this are sub-split (= embedder limit)
fallback_chunk_tokens = 400       # §3 legacy/oversized token-window chunking
fallback_chunk_overlap = 80

[retrieval.query]
max_results = 6                   # recall_memory default
# Absolute relevance floor in [0,1]; drop results scoring below it. After the
# saturating BM25 transform (rel/(rel+k)) this is an *absolute* quality cut, not a
# within-candidate rank cut — a weak lone match scores low and can fall below it.
min_score = 0.35
vector_weight = 0.7               # §8a hybrid weights (normalized; sum must be > 0)
text_weight = 0.3
candidate_multiplier = 4
mmr_enabled = false               # §8a diversity re-rank (off, like OpenClaw)
mmr_lambda = 0.7
temporal_decay_enabled = true     # §8b — ON (diary recency matters; real timestamps)
temporal_decay_half_life_days = 45

[retrieval.auto]
max_results = 3                   # §8c — small on purpose
# Tighter absolute floor than the tool — see [retrieval.query].min_score. With the
# saturating BM25 transform this reliably excludes weak common-word-only matches.
min_score = 0.45
max_tokens = 600                  # whole injected block budget
dedup_against_recency = true      # §8c — skip blocks already in the §10a recency layer

[retrieval.embedding]
# Active model resolution (§5a): an explicit `provider` wins; an unset `provider`
# defaults to remote when a resolvable [.remote] block is present, else local. So
# `provider="local"` plus a populated [.remote] block runs local (startup logs a
# warning about the ignored block); `provider="remote"` with no block fails fast.
provider = "local"                # 'local' | 'remote'

[retrieval.embedding.local]
model = "bge-small-en-v1.5"       # fastembed, 384-dim, English (§5c)
dim = 384

# Optional remote endpoint; OpenRouter-compatible (§5d). When set (and provider is
# "remote", or provider is unset), it becomes the active model and `dim` governs the
# vector index width. Leave commented to use the local model.
# [retrieval.embedding.remote]
# id = "openai/text-embedding-3-small"
# endpoint = "https://<our-proxy>/api/v1"
# api_key = "${OPENROUTER_KEY}"
# dim = 1536

# Chat-history search & recap (ARCHITECTURE.md §9e). The FTS5 + metadata index that
# backs the search_messages / recap / user_activity tools is ALWAYS built (plain
# bundled SQLite, no embeddings); these knobs only tune the absence-gap detection that
# powers "what did I miss since I was gone" and recap's summary token budget.
[search]
absence_gap_ms = 10800000         # 3h: inter-message gap above which a user counts as "away"
default_lookback_ms = 86400000    # 24h: recap/absence fallback window when a user has no recent messages
recap_budget_tokens = 6000        # summary token budget recap returns before coarsening to higher levels

[search.summaries]
expand_token_cap = 4000           # max rendered tokens one expand_summary call accumulates before truncating
expand_max_depth = 3              # hard cap on expand_summary's per-call drill depth

# Passive reaction surfacing (ARCHITECTURE.md §9f): let the agent perceive emoji
# reactions (unicode + custom) on messages, without ever triggering a session.
[reactions]
enabled = true                    # master switch: persist inbound reactions AND surface them
show_aggregates = true            # View A: key×count on every rich-tier message
show_discrete = true              # View B: "X reacted Y to your message" lines, interleaved
discrete_assistant_only = true    # View B targets: true = only the agent's own messages
discrete_horizon_messages = 0     # View B horizon: 0 = whole rich tier; >0 = last N rich messages
discrete_name_cap = 8             # >N senders on one reaction → first 4 + "(and N others)"

# Proactive posting (ARCHITECTURE.md §9g): let the bot post on its own initiative
# on a self-adjusting random schedule, for an explicitly opted-in set of channels.
# Opt-in ONLY — inert unless enabled = true AND at least one [[proactive.channels]]
# is listed (there is deliberately no "all rooms" mode). Every run counts against
# the daily budget, including NO_REPLY; skipped gate attempts do not. The global
# fields here are defaults, overridable per channel.
[proactive]
enabled = false
session_type = "proactive"             # session_types key used for proactive runs
daily_posts = 3                        # target proactive sessions/day per channel
min_user_messages = 10                 # human messages since the bot last spoke before it may post again
dead_channel_backstop_ms = 21600000    # 6h: skip if the newest message is older than this (no necro-bumping)
min_gap_ms = 1800000                   # 30m floor between attempts (anti busy-poll)
# active_hours = { start = 9, end = 1 } # optional local-hour window; wraps midnight when end <= start
# channels = []                        # opt specific rooms in via [[proactive.channels]] in local config
kickoff_prompt = """
It is {time}. No message is addressed to you right now — you have not been triggered. Read the recent conversation above and decide, honestly, whether you have something genuinely worth adding: a thought, a follow-up, a reaction, something that fits the moment. If you do, say it with send_message — one message, natural, not forced. If you do not, output exactly NO_REPLY. Staying quiet is the normal, common outcome; only post when it actually adds something.
"""

# The proactive session type: identical to a default chat session (all tools, same
# model) plus a standing instruction. No `tools` allowlist ⇒ inherits all tools, so
# a proactive check-in can search, recap, react, browse, etc. just like a reply.
[agent.session_types.proactive]
model = "default"
session_instruction = """
You are running a proactive check-in, not responding to anyone. Default to silence. Do not greet, do not announce yourself, do not ask "is anyone there", do not repeat a point you already made. Contribute only if it genuinely improves the conversation; otherwise output exactly NO_REPLY.
"""

[agent.session_types.diary]
model = "default"
workspace_files = ["AGENTS.md", "SOUL.md"]
tools = ["diary_tool"]
skills = "none"
max_tool_calls = 30
max_turns = 15
session_instruction = """
You are writing in your own first-person diary. Above you can see, in <your_recent_memory>, your existing recent diary entries (read-only, for continuity), and in <conversation>, a stretch of conversation from {{room}} with timestamps.

Write a NEW diary entry about YOUR OWN part in that conversation: what you said and did, how you reacted, opinions you formed, running bits, things you promised to do. A neutral record of what happened already exists elsewhere — do not recap the room or narrate other people; write only your own thread, in your own voice. Build on your existing entries rather than restating them ("X did Y again", ongoing threads, etc.).

Begin your entry with EXACTLY this header line, character for character:
{{header}}

Then write your entry below it. Markdown is fine; be concise.

Use the diary_tool: `create` to start (the very first line MUST be the header above), then `str_replace`/`insert` to revise, then set `finalize: true` on your final tool call (on ALL tools if your final batch has several). If there is genuinely nothing about your own participation worth keeping, call diary_tool with command `view` and `finalize: true` on the empty draft to finish without writing anything.
"""

[agent.session_types.summarize]
model = "default"
workspace_files = ["AGENTS.md", "SOUL.md"]
tail_file = "SUMMARIZE_TAIL.md"
tools = ["summary_tool"]
skills = "none"
# Runaway loop-breakers (NOT a wall-clock timeout): high enough to never bite a
# healthy run, low enough to break a degenerate loop. Hitting either aborts the
# run → the pool's catch → failure → retry path.
max_tool_calls = 30
max_turns = 15
session_instruction = """
You are performing a summarization task. Summarize the chat messages visible at the end of your context — everything from the latest previous summary (or the beginning, if none) to the most recent message shown.

Write your summary using the summary_tool. Use `create` to start, then `str_replace` or `insert` to revise. When satisfied, call summary_tool with `finalize: true` to complete.

Guidelines:
- Preserve key facts, decisions, names, and temporal markers.
- Use timestamps or relative time references so readers can locate events.
- Do not editorialize or interpret — summarize what happened.
- Do not describe what the conversation "started with" or "ended with" — just summarize the content in the range.
- Keep the summary within the token budget. If the tool returns a size error, shorten your summary.
- When you're done, set finalize: true on your last tool call. If calling multiple tools in your final batch, set finalize: true on ALL of them.
"""

[agent.session_types.condense]
model = "default"
workspace_files = ["AGENTS.md", "SOUL.md"]
tail_file = "SUMMARIZE_TAIL.md"
tools = ["summary_tool"]
skills = "none"
max_tool_calls = 30
max_turns = 15
session_instruction = """
You are condensing several lower-level summaries into a single higher-level summary. The summaries to condense are shown at the end of your context, in chronological order.

Write your condensed summary using the summary_tool, exactly as in a normal summarization task (`create`, then `str_replace`/`insert`, then `finalize: true`).

Guidelines:
- Preserve key facts, decisions, names, and temporal markers that span the summaries.
- Drop session-specific or low-level detail that no longer matters at this altitude.
- Use timestamps or relative time references so readers can locate periods.
- Do not editorialize. Keep within the token budget; shorten if the tool returns a size error.
- When done, set finalize: true on your last tool call (on ALL tools if your final batch has several).
"""

[matrix.accounts.miku]
homeserver = "${MATRIX_HOMESERVER}"
access_token = "${MATRIX_ACCESS_TOKEN}"
password = "${MATRIX_PASSWORD}"
recovery_key = "${MATRIX_RECOVERY_KEY}"
user_id = "${MATRIX_USER_ID}"
device_id = "${MATRIX_DEVICE_ID}"
store_path = "./var/matrix/miku"

# Browser-use backend (spec/BROWSER-USE.md; ARCHITECTURE.md browser section). Off
# by default. When enabled, the `browser` tool drives one persistent stealth
# Chromium identity inside an operator-run CloakBrowser-Manager (a sibling docker
# service — docker/docker-compose.browser.yml), connected in-process over CDP.
# The harness does NOT manage that container; it connects over HTTP and degrades
# gracefully if the Manager is down. Set everything explicitly in local config.
[browser]
enabled = false
manager_url = "http://127.0.0.1:8080"  # CloakBrowser-Manager base (loopback-published)
# auth_token is intentionally unset here: ABSENT ⇒ token-less Manager (localhost
# isolation only). Set it in local config to "${BROWSER_AUTH_TOKEN}" to match the
# Manager's AUTH_TOKEN. PRESENT-but-empty is rejected at load time (fail-fast).
profile_name = "miku"                   # the single persistent identity (resolved by name)
platform = "windows"                    # fingerprint platform: windows | macos | linux
fingerprint_seed = 0                    # 0/unset ⇒ Manager picks a random seed once, then persists it
humanize = true                         # Bézier mouse + per-char typing
evaluate_enabled = false                # gate browser act:evaluate (arbitrary page JS)
# screen_width / screen_height: unset ⇒ Manager default 1920x1080
# timezone / locale: unset ⇒ default to agent.timezone (+ a derived locale)
proxy = ""                              # optional http(s)://… or socks5://…; empty ⇒ direct egress
geoip = false                           # match spoofed TZ/locale to the proxy exit IP
dialog_policy = "dismiss"               # auto JS dialog handling: dismiss | accept (alert always accepts)
snapshot_max_chars = 20000              # truncate AI snapshots to bound context cost
snapshot_max_frames = 10                # max iframes descended per snapshot (0 ⇒ main document only)
nav_timeout_ms = 30000                  # per-navigation timeout
act_timeout_ms = 15000                  # per-action timeout
connect_timeout_ms = 20000              # connectOverCDP + first-launch cold start
session_page_idle_ms = 600000           # close a session's tab after this idle (bounds tab growth)
