[app]
name = "mikuswarm"
data_dir = "./var"
log_level = "info"
context_dump_dir = "./debug/context"

[agent]
disabled_tools = ["web_fetch", "web_search"]
# IANA time zone the agent operates in. Every date the agent sees is rendered in
# this zone (never the server's real zone), and it is exported as TZ to the
# process and the Docker sandbox. Set explicitly in local config.
timezone = "UTC"
# Per-session-run cost ceiling (spec SESSION-COST-LIMITS). Counts agent-loop +
# tool-use cost (captioning excluded). max_session_cost_usd is intentionally unset
# here → sessions are uncapped by default; set it (globally and/or per session
# type via [agent.session_types.*]) in local config to bound spend. When a ceiling
# IS set, cost_warn_fraction is the point at which the agent receives a one-shot
# "wind down" interjection before the hard block at 100%.
# max_session_cost_usd = 1.00
cost_warn_fraction = 0.8

[observability]
# Capacity of the in-memory Layer-0 LLM request ring backing
# GET /api/llm-requests (spec LLM-FAILURE-HANDLING §9.2). Newest-first,
# fixed-capacity; not durable (llm-gateway holds the authoritative wire log).
llm_request_ring_size = 500

# In-process observability console (read-only HTTP + SSE; spec/OBSERVABILITY-UI.md
# Part B). Off by default — enable it explicitly in local config and set an
# auth_token. Binds localhost; the console is for the operator, not end users.
[observability.server]
enabled = false
bind = "127.0.0.1"
port = 8799
# auth_token = "${MIKUSWARM_CONSOLE_TOKEN}"  # when set, required as a bearer token

[agent.sessions]
max_concurrent = 3
max_concurrent_dm = 1
max_queued_per_timeline = 10000
forced_completion_retries = 3
# Co-target coalescing window (spec DUPLICATE-REPLY-MITIGATION §8): a new reply
# whose reply-target matches a running session's trigger reply-target is folded
# into that session (as a co-reply interjection) instead of spawning a twin, but
# only if the two are within this many ms of each other. Short (a minute) so only
# near-simultaneous reactions to the same beat merge.
coalesce_window_ms = 60000
# max_tool_calls is intentionally unset → agent work is unbounded (the loop runs
# as long as the model emits tool calls). Set a number here only to impose a cap.

# Resumable sessions (spec RESUMABLE-SESSIONS). Replying to a message the bot sent
# continues THAT session as a multi-turn rollout (it remembers what it did) instead
# of spawning a fresh, amnesiac session. Off by default in both contexts; opt in
# per context below. A wrong guess degrades to a fresh session, never to corruption
# or message loss.
[agent.sessions.resume]
# Reserve the scarce single resume for the original asker (§6/§7): a reply from a
# different user starts a fresh session. Global; inert in DMs. Explicit agent
# delegations bypass this — it gates human replies only.
same_user_only = true

# Resume is off unless the message's context is enabled here (§14).
[agent.sessions.resume.enabled]
dm = false
group = false

# Resume time window (§7), per context. A reply more than this many ms after the
# session completed starts a fresh session. 0 or -1 = unlimited.
[agent.sessions.resume.window]
dm = 21600000     # 6h — focused 1:1; a reply carries explicit continuation intent
group = 3600000   # 1h — noisy; bound staleness / blast-radius of a wrong guess

# Gap backfill (§9): surface room messages the session missed while away, prepended
# to the resumed turn. Off by default. 0 = none, >0 = cap, -1 = unlimited; the two
# limits are never both -1 (app.ts validates). max_tokens excludes the request.
# DMs stay off for a stronger reason than size (§9.2): a DM's gap is entirely other
# sessions' triggers. Groups are where enabling it is meaningful.
[agent.sessions.resume.gap.dm]
max_messages = 0
max_tokens = 0

[agent.sessions.resume.gap.group]
max_messages = 0
max_tokens = 0

# Satellite re-rendering on resume (§11). runtime_state is always re-rendered
# (forced on) and retrieved_memory is always omitted (forced off); the tail
# instructions are the only knob — repeating them keeps high-adherence guidance
# near the context end, where a long resumed rollout drifts worst.
[agent.sessions.resume.satellite]
tail = true

# Work gate (§7a): resume only continues STATEFUL work — a session whose rollout is
# pure conversation has nothing a fresh session lacks. The base rule (≥1 non-exempt
# tool call in scope) is always on; these knobs tune HOW work is measured, per
# context. scope = "since_last_turn" (strict: work in the latest turn's rollout) or
# "any_in_history" (loose: work anywhere so far). extra_exempt_tools lists extra
# tool names (incl. mcp__*) to NOT count as work, atop the built-in exempt set.
[agent.sessions.resume.work_gate.dm]
scope = "any_in_history"    # follow-up chains keep prior work's context
extra_exempt_tools = []

[agent.sessions.resume.work_gate.group]
scope = "since_last_turn"   # a single lookup can't swallow the room's back-and-forth
extra_exempt_tools = []

# Follow-up folding (spec FOLLOWUP-FOLDING). Matrix sends text and media as separate
# events, so a "look at this" + image (either order), or a quick "actually, London"
# correction, splits one intent across messages. Each quick same-sender follow-up is
# folded into the session its immediately-prior triggering message produced —
# STEERED into it if running, PARKED if still building, or RESUMED if it just
# completed — instead of being lost, answered half-blind, or spawned as a twin.
# Three independent levers, each a TWO-clock gate: user_gap_ms (origin-ts diff, the
# gap as the user felt it) AND wall_clock_ms (watch lifetime; absorbs upload/decrypt/
# caption lag). Both must pass. Replies are never folded (they keep their own paths).
# All on by default; per-lever enabled=false disables that form.
[agent.sessions.followup.media]
enabled = true
user_gap_ms = 10000      # forced-split image — highest confidence it's a continuation
wall_clock_ms = 30000    # generous: covers upload + federation + decrypt + captioning

[agent.sessions.followup.text]
enabled = true
user_gap_ms = 7000       # tighter — the text could have carried the @ and didn't
wall_clock_ms = 15000    # text has no upload/caption lag, so less slack needed

[agent.sessions.followup.mention]
enabled = true
user_gap_ms = 5000       # tightest — an explicit re-@ may be a genuinely new ask
wall_clock_ms = 12000

[agent.system]
fallback_prompt = "You are Miku, a helpful Matrix chat agent. Reply naturally and use NO_REPLY when no response is needed."

# Recovery — request-level resilience (spec LLM-FAILURE-HANDLING).
# Layer 0: transparent per-request retry for ENVIRONMENTAL LLM failures
# (connection reset, timeout, 5xx, 429, mid-stream deaths — partials discarded).
# The exact same request is re-issued; a success after N failures is
# byte-equivalent to a first-attempt success. The budget is wall-clock, not a
# count: interactive-class sessions (live chat, proactive) retry within
# llm_request_max_wait_ms then park `failed-resumable` for manual console
# resume; background-class work (summaries, diaries) retries WITHOUT BOUND —
# inference downtime is routine and background work waits it out.
[recovery]
llm_request_backoff_base_ms = 500   # local backoff (healthy model, unthrottled group only)
llm_request_backoff_max_ms = 15000
llm_request_max_wait_ms = 120000    # interactive-class wall-clock budget (~the edge of a reply still being useful)
# Per-model health (failure domain, derived from endpoint+model id): after this
# many consecutive environmental failures the model turns unhealthy — one probe
# request per fixed interval; on probe success every waiter resumes together.
llm_unhealthy_threshold = 3
llm_probe_interval_ms = 60000
# Optional static phrase sent to the room when a user-triggered session gives
# up (parks failed-resumable / build-wait timeout). Empty = silent (default).
# The actual error is never included. Proactive/synthetic sessions never send it.
failure_notice = ""

[models.default]
id = "claude-opus-4-7"
provider = "anthropic"
# Wire API the endpoint speaks (pi-ai api registry): "anthropic-messages" |
# "openai-completions" | "openai-responses" | "google-generative-ai". For
# OAI-compatible gateways, also set `provider` to the real upstream (e.g.
# "together") so pi-ai picks the right request dialect.
api = "anthropic-messages"
endpoint = "${ANTHROPIC_BASE_URL}"
api_key = "${LLM_API_KEY}"
multimodal = true
max_tokens = 16384
# Capability flag only ("this model supports extended thinking") — it does NOT
# turn thinking on. thinking_level below does.
reasoning = true
# Extended-thinking level requested on every call with this model:
# "off" | "minimal" | "low" | "medium" | "high" | "xhigh". On adaptive-thinking
# models (Opus/Sonnet 4.6+) this is an effort hint (the model decides when and
# how much to think); on older models it maps to a token budget. A non-off
# level requires reasoning = true (fail-fast at startup).
thinking_level = "off"
# The model-level context ceiling AND the always-on enforcement base. Set it
# deliberately BELOW the physical provider window (128000 vs this model's ~200k
# real window) to stay clear of edge-case degradation/cost. It is the SOLE
# model-level limit: the operative per-session ceiling is
# min(context_window, session_type.max_context_tokens), resolved once and fed to
# enforcement, the pi-ai model descriptor, and the text-editor read budget.
# Required on any model a session type resolves to (fail-fast at startup) — so
# interactive sessions are always bounded, never grow until the provider rejects.
context_window = 128000
# Cap on the base64-encoded image payload shipped to the provider (not raw
# bytes; raw inflates ~4/3 in base64). 5 MB ≈ 3.75 MB raw, under Anthropic's
# per-image inline cap.
image_input_bytes = 5242880
# Per-model override of the interactive-class wall-clock retry budget
# (recovery.llm_request_max_wait_ms). The budget bounds only WAITING (admission
# queue + inter-attempt backoff) and a STUCK attempt that emits zero tokens by
# the deadline — it never aborts a streaming attempt that has produced any token
# (incl. reasoning). Set a larger value for a model that is slow to FIRST token.
# Defaults to the recovery value; shipped explicitly per the explicit-config rule.
llm_request_max_wait_ms = 120000

[models.default.cost]
input = 0
output = 0
cache_read = 0
cache_write = 0

[models.default.compat]
supports_cache_control_on_tools = false
supports_long_cache_retention = false

[context.tiers]
rich_target_tokens = 4000
rich_max_tokens = 8000
compact_target_tokens = 16000
compact_max_tokens = 24000

# Pluggable tokenizer (spec/TOKENIZER-SWAP.md §5.4). `primary` is the chat/context/
# summarization estimator (everything that bounds what we send the chat model);
# `retrieval` is the memory chunker's, which must match the EMBEDDER, not the chat
# model — so switching `primary` to "glm" must NOT change `retrieval`, or the memory
# corpus would re-chunk. Both default to "gpt-tokenizer" (the shipped default +
# always-available fallback). `glm_tokenizer_path` points at the GLM-5.1 tokenizer.json
# (MIT) fetched on build into native/assets/glm-5.1/ (checksum-verified by
# scripts/fetch-glm-tokenizer.mjs; run `pnpm fetch:tokenizer` if absent). It is loaded
# only when a selection is "glm", so it is inert under the default. Flip `primary = "glm"` to count the
# model-facing budgets in real GLM tokens — calibration (spec/TOKENIZER-CALIBRATION.md)
# measured GLM-5.1 ≈ gpt-4o (~1.02×) on live data, so the token knobs need no rescaling.
[tokenizer]
primary = "gpt-tokenizer"        # "gpt-tokenizer" | "glm"
retrieval = "gpt-tokenizer"      # match the embedder, not the chat model
glm_tokenizer_path = "native/assets/glm-5.1/tokenizer.json"

[media]
download_size_limit = 1073741824

[media.image]
max_total_pixels = 921600
max_total_pixels_hard = 1843200
min_shortest_side = 480
max_bytes = 1048576
mozjpeg = true

[media.video]
max_resolution = 480
max_bytes = 52428800
max_duration_seconds = 120
gpu_acceleration = false
x264_preset = "veryfast"
cache_max_bytes = 21474836480
cache_target_bytes = 16106127360

[media.audio]
max_bytes = 20971520
max_duration_seconds = 300

[storage]
database_path = "./var/mikuswarm.db"

[workspace]
root_dir = "./workspaces/miku"

# Docker sandbox (ARCHITECTURE.md §11a). Off by default; when enabled, the `bash`
# tool and `search_files`/ripgrep run inside a long-lived container with the
# workspace bind-mounted at workspace_mount. Enabling requires the image built
# (docker/build-sandbox.sh) and Docker reachable, or startup fails fast.
[sandbox]
enabled = false
image = "mikuswarm-sandbox:24.04"
container_name = "mikuswarm-sandbox"
network = "mikuswarm-sandbox"
workspace_mount = "/workspace"
# Bind-source mode for the sandbox's workspace mount: "host" = the workspace
# path is a host path the daemon can resolve directly (native runs). "container"
# = the agent itself runs in a container; the host-side source is resolved at
# startup from the agent's own container mounts (set by docker/95-docker.toml —
# never needed for native runs).
workspace_bind_source = "host"
exec_timeout_ms = 120000      # default per-command timeout (overridable per bash call)
max_output_bytes = 1048576    # cap on captured stdout/stderr per stream
stop_on_shutdown = false      # leave the container running across restarts

[timeline]
# Channel lifecycle: a timeline is inactive until first triggered. On the first
# trigger the bot backfills recent history before the activating session runs.
initial_backfill_messages = 200       # messages to fetch (0 = no backfill)
initial_backfill_window_ms = 3600000  # 1h of history before the trigger (the activation moment); whichever limit is reached first
initial_backfill_timeout_ms = 30000   # 30s; the first trigger is held this long
initial_backfill_page_size = 100      # messages per backward page request (clamped 1–1000)
inactive_event_retention_days = 0     # 0 = no pruning; >0 prunes old inactive-timeline events
# Undecryptable (UTD) event handling (issue #11).
initial_backfill_utd_halt_threshold = 50  # stop paging after N consecutive UTD events (0 = off)
redecryption_sweep_interval_ms = 60000    # retry stored UTD events every 60s (0 = sweeper off)
redecryption_sweep_batch = 50             # max UTD events probed per sweep tick

# Startup gap backfetch (ARCHITECTURE.md §7c): on startup, per room, paginate
# backward from the live head down to the last message already stored (the floor),
# recovering everything said while the bot was offline and processing it exactly
# like a live message — EXCEPT that backfetched messages never start a session
# (reactive/proactive starts for a room are frozen until its gap is filled). The
# committed high-water never advances until a room's gap is fully closed, so a
# crash at any point is recoverable as a single re-derived gap on the next boot.
gap_backfetch_enabled = true              # master switch (on by default)
gap_backfetch_max_messages = 0            # per-room cap; 0 = UNBOUNDED (recover the whole gap)
gap_backfetch_window_ms = 0               # don't fetch older than now-this; 0 = no window bound
gap_backfetch_timeout_ms = 0              # per-room wall-clock budget; 0 = no timeout
gap_backfetch_page_size = 100             # messages per backward page request (clamped 1–1000)
gap_backfetch_utd_halt_threshold = 50     # stop paging after N consecutive UTD events (0 = off)
gap_backfetch_concurrency = 3             # rooms fetched in parallel on startup

[matrix]
enabled = false
trigger_hold_ms = 2000
trigger_group_lookback_ms = 20000

[enrichment]
trigger_wait_timeout_ms = 30000

# X.com enrichment via the FxTwitter API + the x_fetch tool (ARCHITECTURE.md
# §7a/§10). X status URLs are partitioned away from the Synapse preview path
# and enriched into a rich structured preview (tweet + quote, stats, polls,
# media through the captioning pipeline). enabled = false turns X previews off
# entirely (no Synapse fallback — its og-card for X is noise). There are no
# byte caps here: all media fetches ride media.download_size_limit. The
# compact-tier truncation (280/140 chars) is a renderer constant, not config.
[fxtwitter]
enabled = true
api_base = "https://api.fxtwitter.com"  # self-hostable mirror override
fetch_timeout_ms = 15000
max_text_chars = 2000                   # rich tier, per tweet node (text & community note each)
prefer_mosaic = true                    # false → individual photo assets instead of the mosaic collage
max_videos_per_tweet = 4                # per node (tweet and quote each); X's own per-post max
extra_status_hosts = []                 # extra mirror base-domains (+ their subdomains), merged into the built-in set

# The x_fetch tool: manual tweet fetching (web_fetch is blocked by X
# server-side), paginated text plus list/download/view access to tweet media —
# the escape hatch to individual photos behind an enrichment mosaic.
[fxtwitter.tool]
enabled = true                          # registers x_fetch (independent of the enrichment enable)
default_max_chars = 4000                # per returned window
max_chars_limit = 16000                 # hard cap per returned window
max_total_chars = 32768                 # cap on the assembled document (paginated via offset)
max_view_blocks = 4                     # image blocks per call via view_media

# Per-host HTTP egress limiting (spec Design D), enforced at the guardedFetch
# chokepoint and keyed per host (shared across all callers). This is NOT a
# cross-domain cap (the old enrichment.fetch_concurrency cap of 6 is removed): each
# host gets a generous admission cap, with a high global backstop and unconditional
# 429/503 + Retry-After backoff. Danbooru is deliberately NOT configured here — it
# owns an internal limiter in its tool ([danbooru].min_request_interval_ms / max_in_flight).
[rate_limits.http]
default_max_in_flight_per_host = 8   # generous per-host guard, not across domains
global_ceiling_max_in_flight = 256   # pure degenerate backstop (many-channels); far above normal load
backoff_base_ms = 500                # 429/Retry-After backoff is always on; these tune it
backoff_max_ms = 30000

# LLM request scheduling (spec Design A, src/agent/scheduler.ts). One admission
# queue per rate-limit GROUP (= one shared upstream budget); requests are served
# by priority class (interactive > proactive > background > background_low, from
# the session type / workload), FIFO within a class. `max_in_flight` is the only
# lever: outstanding requests held by the group — SMALL for a scarce budget so
# the upstream queue stays shallow and local priority is meaningful; raise it for
# a generous budget. There is deliberately NO max_rpm (an idle budget is never
# slowed); 429/503 backoff is unconditional in code, the knobs below only tune it.
# Everything (all agent session types, image_generate, captioning, remote
# embedding) lands in `default` unless its model block sets `rate_limit_group` to
# another group declared here — e.g. captioning on a separate OpenRouter budget:
#   [rate_limits.llm.openrouter]
#   max_in_flight = 16
#   [captioning.model]
#   rate_limit_group = "openrouter"
[rate_limits.llm.default]
max_in_flight = 2
backoff_base_ms = 1000
backoff_max_ms = 60000

[network]
# App-layer SSRF guard (defense-in-depth). When true, outbound fetches from
# caller-supplied URLs (web_fetch, media downloads, image references, …) resolve
# DNS and block private/loopback/link-local/metadata addresses, re-validating
# every redirect hop. This is the only egress protection on a bare-metal `tsx`
# run, so it defaults ON. Disable (false) ONLY where the container/network
# firewall already blocks private egress — the Compose deployment does this via
# docker/egress-rules.sh and flips this off in docker/95-docker.toml.
ssrf_guard = true
# Optional outbound HTTP(S) proxy for all tool fetches (leave unset for none).
# http_proxy_url = "http://proxy.internal:8080"

# Caption-inference concurrency is governed by the model's LLM rate-limit group
# (`max_in_flight` under [rate_limits.llm.*], via [captioning.model].rate_limit_group);
# there is no per-modality concurrency knob.
[captioning]
worker_count = 2
caption_all = false
caption_assistant_messages = false
trigger_wait_timeout_ms = 45000
max_retries = 2

[captioning.model]
id = "google/gemini-3.5-flash"
endpoint = "${OPENROUTER_BASE_URL}"
api_key = "${LLM_API_KEY}"

[captioning.image]
prompt = "Describe the image."
max_chars = 500

[captioning.video]
prompt = "Describe the video."
max_chars = 500
timeout_ms = 120000

[captioning.audio]
prompt = "Transcribe and describe the audio."
max_chars = 2000
timeout_ms = 60000

[sillytavern]
output_subdir = "cards/sillytavern"
export_subdir = "exports/sillytavern"
default_excerpt_chars = 2000
max_excerpt_chars = 4000
max_summary_entries = 20

[user_profiles]
root_dir = "users"
default_excerpt_chars = 1600
max_excerpt_chars = 6000
# When false, explicit cross-user targets (e.g. `user_profile_read` with a
# target.senderId that differs from the trigger sender) are rejected. Default
# true preserves the existing behavior — the agent can record notes about
# other room members on the requester's behalf.
allow_cross_user_targets = true

[danbooru]
base_url = "https://danbooru.donmai.us"
max_regular_tags = 2
default_limit = 20
download_subdir = "downloads/danbooru"
# Tag-suggestion ("did you mean") support. On a zero-result search, resolve each
# supplied includeTag through Danbooru's autocomplete + tag-wildcard endpoints
# and append real, similar tag names — the agent's recovery hint when it guessed
# a tag that does not exist. The same resolver backs `action = "tags"`.
suggest_on_empty = true
max_suggestions = 6

# Image generation / editing via Google's Gemini "nano banana" models.
# `base_url` is the Gemini API endpoint ROOT — the tool appends
# /v1beta/models/<model>:generateContent. This is the Google/Gemini API base
# (GEMINI_BASE_URL), distinct from the Anthropic model endpoint. `api_key` is
# sent as `Authorization: Bearer`.
[image_gen]
base_url = "${GEMINI_BASE_URL}"
api_key = "${LLM_API_KEY}"
timeout_ms = 120000
# Mandatory and high: Gemini emits the image AS output tokens (~1290 for 1K).
# Many gateways default this cap low, truncating before any image is emitted.
max_output_tokens = 32768
output_subdir = "generated-images"

[image_gen.models]
pro = "gemini-3-pro-image"
flash = "gemini-3.1-flash-image"

# X.com (Twitter) search via Grok-as-subagent (spec/X-SEARCH.md). Routes through
# OpenRouter/LlmGateway: `base_url` is the OpenRouter API ROOT (the tool appends
# /chat/completions), reusing the existing OPENROUTER_BASE_URL + LLM_API_KEY — no
# new credential, no new egress host. Grok returns a cited synthesis; miku then
# re-fetches the cited tweets through its own FxTwitter pipeline (verbatim text +
# media) and captions the top images inline, so fabricated citations are dropped
# and counted and the persona actually "sees" tweet images. Ephemeral, like
# x_fetch — nothing is persisted to channel history / the retrieval corpus.
[x_search]
enabled = true
base_url = "${OPENROUTER_BASE_URL}"
api_key = "${LLM_API_KEY}"
model = "x-ai/grok-4.3"             # effort=fast tier (default; quick non-reasoning)
deep_model = "x-ai/grok-4.3"        # effort=deep tier (set to a reasoning model)
timeout_ms = 60000                  # reasoning search is slow; graceful timeout
cache_ttl_minutes = 10              # cache the (expensive) Grok synthesis; 0 = off
hydrate_default = 5                 # cited tweets re-fetched verbatim via FxTwitter
hydrate_max = 10                    # hard cap the `hydrate` parameter is clamped to
caption_top = 4                     # images auto-captioned inline; rest → media tool
source_text_chars = 600             # per-source verbatim text window in the Sources block
enable_image_understanding = true   # Grok's vision over images it finds while searching
enable_video_understanding = true   # Grok's vision over videos it finds while searching

# Per-MTok USD rates for the Grok call's tool_invocations ledger row (X-SEARCH §7).
# Left unset here per the explicit-deployment-config convention — set real rates in
# local config; unset = usage captured, cost untracked (0).
# [x_search.cost]
# input = 0.0
# output = 0.0

# Reverse-image source lookup via SauceNAO (spec SAUCENAO-SOURCE-LOOKUP), backing
# the `find_source` tool: image → source URL + artist (the inverse of `danbooru`).
# Opt-in and disabled by default. `api_key` is deliberately NOT templated here:
# a `${SAUCENAO_API_KEY}` default would fail startup whenever the env var is unset
# (env substitution errors on missing vars before validation). Set it explicitly
# in local config, e.g.  api_key = "${SAUCENAO_API_KEY}"  alongside enabled = true.
[saucenao]
enabled = false
base_url = "https://saucenao.com"
numres = 8                   # results requested per search
max_results_limit = 16       # hard cap on the per-call `limit` parameter
min_similarity = 55          # % floor; below this is usually noise (agent can lower per-call)
db = 999                     # search all SauceNAO indexes
timeout_ms = 15000
max_image_bytes = 4000000    # condition uploads down to ~4MB before sending
view_max_blocks = 3          # max matched thumbnails inlined when view=true (vision models)

# In-memory short-window quota guard (~6 searches / 30s on the free tier). The
# long/daily window (~200/day) is surfaced from SauceNAO's own counters, not
# enforced locally. max_wait_ms bounds how long a call waits for a free slot
# before returning a soft "try again shortly" result.
[saucenao.rate_limit]
short_window_max = 6
short_window_ms = 30000
max_wait_ms = 8000

[summarization]
enabled = true
worker_count = 1
generation_threshold_tokens = 6000
leaf_input_tokens = 4000
leaf_target_tokens = 600
condense_fanout = 5
condense_target_tokens = 800
summary_max_overage_factor = 2.5
max_retries = 2
label_cache_ttl_ms = 600000

# Diary memory (ARCHITECTURE.md §9c). The agent's durable, first-person journal of
# its own participation, written automatically from each level-1 summary range and
# surfaced back into chat sessions (§10a). When disabled the worker simply doesn't
# drain — level-1 summaries still queue `diary_status='pending'` and flush if it is
# re-enabled later (no backfill machinery).
[diary]
enabled = true
worker_count = 1                  # like summarization; diary is not latency-critical.
max_retries = 3                   # a lost diary entry is acceptable, so an extra retry is a cheap hedge.
per_session_budget_tokens = 1200  # new-section cap = 1/5 of generation_threshold_tokens (6000).
recency_max_tokens = 6000         # token ceiling for the recent-memory window (§9a/§10a).
recency_file_count = 2            # N most recent EXISTING day files at/before the anchor (§9a).

# Memory retrieval (ARCHITECTURE.md §9d). Hybrid lexical+semantic search over
# memory/*.md: the recall_memory tool, and auto-retrieval of relevant past entries
# injected per trigger. Phase 1 (lexical FTS5/BM25) needs no external deps; the
# semantic half uses a small in-process embedding model (or a configured remote
# endpoint). Disable the whole subsystem by setting enabled = false.
[retrieval]
enabled = true
auto_retrieval = true             # §8c — inject the small relevant-memory block per trigger

[retrieval.index]
worker_count = 1                  # embedding worker pool (not latency-critical)
max_retries = 3
embed_batch_size = 32             # chunks per remote /embeddings call
max_chunk_tokens = 512            # oversized header blocks above this are sub-split (= embedder limit)
fallback_chunk_tokens = 400       # §3 legacy/oversized token-window chunking
fallback_chunk_overlap = 80

[retrieval.query]
max_results = 6                   # recall_memory default
# Absolute relevance floor in [0,1]; drop results scoring below it. After the
# saturating BM25 transform (rel/(rel+k)) this is an *absolute* quality cut, not a
# within-candidate rank cut — a weak lone match scores low and can fall below it.
min_score = 0.35
vector_weight = 0.7               # §8a hybrid weights (normalized; sum must be > 0)
text_weight = 0.3
candidate_multiplier = 4
mmr_enabled = false               # §8a diversity re-rank (off, like OpenClaw)
mmr_lambda = 0.7
temporal_decay_enabled = true     # §8b — ON (diary recency matters; real timestamps)
temporal_decay_half_life_days = 45

[retrieval.auto]
max_results = 3                   # §8c — small on purpose
# Tighter absolute floor than the tool — see [retrieval.query].min_score. With the
# saturating BM25 transform this reliably excludes weak common-word-only matches.
min_score = 0.45
max_tokens = 600                  # whole injected block budget
dedup_against_recency = true      # §8c — skip blocks already in the §10a recency layer
# User lane (§9d): a lexical-only sub-search keyed on the trigger user's display
# name(s), reserving slots for "my recent history with this person" alongside the
# topical results. Additive to max_results; the combined block still obeys max_tokens.
user_lane_enabled = true
user_lane_max_results = 2          # reserved slots, surfaced ahead of topical hits
# Lower than min_score above: the lane is already name-scoped, so the floor only
# drops near-noise. A single exact name-token hit lands ~0.45, so 0.3 keeps them.
user_lane_min_score = 0.3
user_lane_prefix_enabled = true    # also match shortened forms ("Plaguis"→"Plag")
# Prefix stem length + min token length to attempt prefix. Larger = fewer false
# positives, less tolerance for short nicknames. Exact always beats prefix.
user_lane_prefix_min_chars = 4

[retrieval.embedding]
# Active model resolution (§5a): an explicit `provider` wins; an unset `provider`
# defaults to remote when a resolvable [.remote] block is present, else local. So
# `provider="local"` plus a populated [.remote] block runs local (startup logs a
# warning about the ignored block); `provider="remote"` with no block fails fast.
provider = "local"                # 'local' | 'remote'

[retrieval.embedding.local]
model = "bge-small-en-v1.5"       # fastembed, 384-dim, English (§5c)
dim = 384

# Optional remote endpoint; OpenRouter-compatible (§5d). When set (and provider is
# "remote", or provider is unset), it becomes the active model and `dim` governs the
# vector index width. Leave commented to use the local model.
# [retrieval.embedding.remote]
# id = "openai/text-embedding-3-small"
# endpoint = "https://<our-proxy>/api/v1"
# api_key = "${OPENROUTER_KEY}"
# dim = 1536

# Chat-history search & recap (ARCHITECTURE.md §9e). The FTS5 + metadata index that
# backs the search_messages / recap / user_activity tools is ALWAYS built (plain
# bundled SQLite, no embeddings); these knobs only tune the absence-gap detection that
# powers "what did I miss since I was gone" and recap's summary token budget.
[search]
absence_gap_ms = 10800000         # 3h: inter-message gap above which a user counts as "away"
default_lookback_ms = 86400000    # 24h: recap/absence fallback window when a user has no recent messages
recap_budget_tokens = 6000        # summary token budget recap returns before coarsening to higher levels

[search.summaries]
expand_token_cap = 4000           # max rendered tokens one expand_summary call accumulates before truncating
expand_max_depth = 3              # hard cap on expand_summary's per-call drill depth

# Passive reaction surfacing (ARCHITECTURE.md §9f): let the agent perceive emoji
# reactions (unicode + custom) on messages, without ever triggering a session.
[reactions]
enabled = true                    # master switch: persist inbound reactions AND surface them
show_aggregates = true            # View A: key×count on every rich-tier message
show_discrete = true              # View B: "X reacted Y to your message" lines, interleaved
discrete_assistant_only = true    # View B targets: true = only the agent's own messages
discrete_horizon_messages = 0     # View B horizon: 0 = whole rich tier; >0 = last N rich messages
# Applies ONLY when discrete_assistant_only = false, i.e. to inter-user reaction
# lines — keeps cross-user reaction chatter tighter than the bot-directed lines (the
# reactions that become conversation topics are on recent messages).
discrete_other_horizon_messages = 10  # inter-user horizon: last N rich messages (0 = whole tier)
# Episode splitting (applies to all View B lines): a coalesced reaction is split into
# separate lines when the conversation moved on between two reactions, so each burst
# lands at its own timeline position instead of all at the latest reaction.
discrete_split_messages = 5       # ≥N messages between two reactions to one msg → split (hard seam)
discrete_split_minutes = 30       # with 1..N-1 messages between, also split if >M min elapsed
discrete_name_cap = 8             # >N senders on one reaction → first 4 + "(and N others)"

# Proactive posting (ARCHITECTURE.md §9g): let the bot post on its own initiative
# on a self-adjusting random schedule, for an explicitly opted-in set of channels.
# Opt-in ONLY — inert unless enabled = true AND at least one [[proactive.channels]]
# is listed (there is deliberately no "all rooms" mode). Every run counts against
# the daily budget, including NO_REPLY; skipped gate attempts do not. The global
# fields here are defaults, overridable per channel.
[proactive]
enabled = false
session_type = "proactive"             # session_types key used for proactive runs
daily_posts = 3                        # target proactive sessions/day per channel
min_user_messages = 10                 # human messages since the bot last spoke before it may post again
dead_channel_backstop_ms = 21600000    # 6h: skip if the newest message is older than this (no necro-bumping)
min_gap_ms = 1800000                   # 30m floor between attempts (anti busy-poll)
# active_hours = { start = 9, end = 1 } # optional local-hour window; wraps midnight when end <= start
# channels = []                        # opt specific rooms in via [[proactive.channels]] in local config
kickoff_prompt = """
It is {time}. No message is addressed to you right now — you have not been triggered. Read the recent conversation above and decide, honestly, whether you have something genuinely worth adding: a thought, a follow-up, a reaction, something that fits the moment. If you do, say it with send_message — one message, natural, not forced. If you do not, output exactly NO_REPLY. Staying quiet is the normal, common outcome; only post when it actually adds something.
"""

# The proactive session type: identical to a default chat session (all tools, same
# model) plus a standing instruction. No `tools` allowlist ⇒ inherits all tools, so
# a proactive check-in can search, recap, react, browse, etc. just like a reply.
[agent.session_types.proactive]
model = "default"
session_instruction = """
You are running a proactive check-in, not responding to anyone. Default to silence. Do not greet, do not announce yourself, do not ask "is anyone there", do not repeat a point you already made. Contribute only if it genuinely improves the conversation; otherwise output exactly NO_REPLY.
"""

[agent.session_types.diary]
model = "default"
workspace_files = ["AGENTS.md", "SOUL.md"]
# diary_tool writes the entry; the rest are read/enrich escape hatches for when
# the rendered context is insufficient — recover a tweet behind a [truncated]
# hint or an enrichment mosaic (x_fetch), caption/load an aged-out or
# never-captioned asset (media/read_image), or fetch a referenced URL
# (mcp_exa_web_fetch_exa — the Exa MCP replacement for the disabled web_fetch;
# inert where no Exa server is configured).
tools = ["diary_tool", "x_fetch", "media", "read_image", "mcp_exa_web_fetch_exa"]
skills = "none"
max_tool_calls = 30
max_turns = 15
# Context-token ceiling — an artificial tightening layered on the model's
# context_window (spec CONTEXT-LIMIT-UNIFICATION §2.2): conservative bound on a
# runaway diary session. Effective ceiling = min(context_window, this); enforced
# on ACTUALS (provider-reported context size of the last committed request). Well
# above a healthy diary run's seed (single-digit k) yet far under the model
# context_window (128000); set explicitly per the explicit-deployment-config rule.
max_context_tokens = 60000
session_instruction = """
You are writing in your own first-person diary. The conversation you are writing about is the stretch of chat from {{room}} shown above as regular messages (summaries of earlier history may precede it, for continuity). In <your_recent_memory> you can see your existing recent diary entries (read-only, for continuity).

Write a NEW diary entry about YOUR OWN part in that conversation: what you said and did, how you reacted, opinions you formed, running bits, things you promised to do. A neutral record of what happened already exists elsewhere — do not recap the room or narrate other people; write only your own thread, in your own voice. Build on your existing entries rather than restating them ("X did Y again", ongoing threads, etc.).

Begin your entry with EXACTLY this header line, character for character:
{{header}}

Then write your entry below it. Markdown is fine; be concise.

Use the diary_tool: `create` to start (the very first line MUST be the header above), then `str_replace`/`insert` to revise, then set `finalize: true` on your final tool call (on ALL tools if your final batch has several). If there is genuinely nothing about your own participation worth keeping, call diary_tool with command `view` and `finalize: true` on the empty draft to finish without writing anything.
"""

[agent.session_types.summarize]
model = "default"
workspace_files = ["AGENTS.md", "SOUL.md"]
tail_file = "SUMMARIZE_TAIL.md"
# summary_tool writes the summary; the rest are read/enrich escape hatches for
# content the rendered window cannot carry (truncated tweets, mosaic'd photos,
# aged-out/never-captioned media, referenced URLs). mcp_exa_web_fetch_exa is the
# Exa MCP fetch (web_fetch is intentionally globally disabled); inert where no
# Exa server is configured.
tools = ["summary_tool", "x_fetch", "media", "read_image", "mcp_exa_web_fetch_exa"]
skills = "none"
# Runaway loop-breakers (NOT a wall-clock timeout): high enough to never bite a
# healthy run, low enough to break a degenerate loop. Hitting either aborts the
# run → the pool's catch → failure → retry path.
max_tool_calls = 30
max_turns = 15
# Context-token ceiling — artificial tightening on the model's context_window
# (spec CONTEXT-LIMIT-UNIFICATION §2.2): bounds a runaway summarization session on
# ACTUALS; effective ceiling = min(context_window, this). A breach fails the
# session → the pool's semantic-retry path → a fresh attempt rebuilds context
# from scratch. See the diary block above for the rationale.
max_context_tokens = 60000
session_instruction = """
You are performing a summarization task. Summarize the chat messages visible at the end of your context — everything from the latest previous summary (or the beginning, if none) to the most recent message shown.

Write your summary using the summary_tool. Use `create` to start, then `str_replace` or `insert` to revise. When satisfied, call summary_tool with `finalize: true` to complete.

Guidelines:
- Preserve key facts, decisions, names, and temporal markers.
- Use timestamps or relative time references so readers can locate events.
- Do not editorialize or interpret — summarize what happened.
- Do not describe what the conversation "started with" or "ended with" — just summarize the content in the range.
- Keep the summary within the token budget. If the tool returns a size error, shorten your summary.
- When you're done, set finalize: true on your last tool call. If calling multiple tools in your final batch, set finalize: true on ALL of them.
"""

[agent.session_types.condense]
model = "default"
workspace_files = ["AGENTS.md", "SOUL.md"]
tail_file = "SUMMARIZE_TAIL.md"
# Condense operates over existing summary text (no raw media events in scope),
# so it keeps only the URL-recovery hatches: x_fetch and the Exa MCP fetch.
tools = ["summary_tool", "x_fetch", "mcp_exa_web_fetch_exa"]
skills = "none"
max_tool_calls = 30
max_turns = 15
# Context-token ceiling (spec CONTEXT-LIMIT-UNIFICATION §2.2): same conservative
# bound as summarize — enforced on actuals; effective = min(context_window, this).
max_context_tokens = 60000
session_instruction = """
You are condensing several lower-level summaries into a single higher-level summary. The summaries to condense are shown at the end of your context, in chronological order.

Write your condensed summary using the summary_tool, exactly as in a normal summarization task (`create`, then `str_replace`/`insert`, then `finalize: true`).

Guidelines:
- Preserve key facts, decisions, names, and temporal markers that span the summaries.
- Drop session-specific or low-level detail that no longer matters at this altitude.
- Use timestamps or relative time references so readers can locate periods.
- Do not editorialize. Keep within the token budget; shorten if the tool returns a size error.
- When done, set finalize: true on your last tool call (on ALL tools if your final batch has several).
"""

[matrix.accounts.miku]
homeserver = "${MATRIX_HOMESERVER}"
access_token = "${MATRIX_ACCESS_TOKEN}"
password = "${MATRIX_PASSWORD}"
recovery_key = "${MATRIX_RECOVERY_KEY}"
user_id = "${MATRIX_USER_ID}"
device_id = "${MATRIX_DEVICE_ID}"
store_path = "./var/matrix/miku"

# Browser-use backend (spec/BROWSER-USE.md; ARCHITECTURE.md browser section). Off
# by default. When enabled, the `browser` tool drives one persistent stealth
# Chromium identity inside the CloakBrowser-Manager (the `manager` service in the
# main docker-compose.yml), connected in-process over CDP. The harness does NOT
# manage that container — compose owns its lifecycle; the agent connects over HTTP
# and degrades gracefully if the Manager is down. Set everything explicitly in
# local config (the shipped deployment enables it; see config/90-local.toml).
[browser]
enabled = false
manager_url = "http://127.0.0.1:8080"  # CloakBrowser-Manager base (loopback-published)
# auth_token is intentionally unset here: ABSENT ⇒ token-less Manager (localhost
# isolation only). Set it in local config to "${BROWSER_AUTH_TOKEN}" to match the
# Manager's AUTH_TOKEN. PRESENT-but-empty is rejected at load time (fail-fast).
profile_name = "miku"                   # the single persistent identity (resolved by name)
platform = "windows"                    # fingerprint platform: windows | macos | linux
fingerprint_seed = 0                    # 0/unset ⇒ Manager picks a random seed once, then persists it
humanize = true                         # Bézier mouse + per-char typing
evaluate_enabled = false                # gate browser act:evaluate (arbitrary page JS)
# screen_width / screen_height: unset ⇒ Manager default 1920x1080
# timezone / locale: unset ⇒ default to agent.timezone (+ a derived locale)
proxy = ""                              # optional http(s)://… or socks5://…; empty ⇒ direct egress
geoip = false                           # match spoofed TZ/locale to the proxy exit IP
dialog_policy = "dismiss"               # auto JS dialog handling: dismiss | accept (alert always accepts)
snapshot_max_chars = 20000              # truncate AI snapshots to bound context cost
snapshot_max_frames = 10                # max iframes descended per snapshot (0 ⇒ main document only)
nav_timeout_ms = 30000                  # per-navigation timeout
act_timeout_ms = 15000                  # per-action timeout
connect_timeout_ms = 20000              # connectOverCDP + first-launch cold start
session_page_idle_ms = 600000           # close a session's tab after this idle (bounds tab growth)
# downloads_dir / downloads_local_dir are intentionally unset here: BOTH unset ⇒
# browser downloads are DISABLED (an explicit opt-in that must match the
# deployment's mount topology — the bytes land in the browser container's fs).
# Set both in local config to the shared staging volume's two views: downloads_dir
# as the browser container sees it, downloads_local_dir as the agent sees it
# (see config/90-local.toml). Setting exactly one is a startup error.
