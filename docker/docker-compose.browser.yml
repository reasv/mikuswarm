# CloakBrowser-Manager — sibling operator service (browser-use backend).
#
# SUPERSEDED for the standard deployment: the Manager is now the `manager` service
# in the root docker-compose.yml and comes up with `docker compose up` (its bridge
# firewalled automatically by the egress sidecar). This standalone file + its
# helper scripts (ensure-browser-network.sh, browser-egress-rules.sh) are RETAINED
# for manual / non-compose / debug bring-up only — the same status as
# agent-egress-rules.sh. Prefer the root stack unless you specifically need to run
# the Manager on its own.
#
# Unlike the dev sandbox (whose lifecycle the SandboxManager drives via the raw
# docker CLI), this Manager is an INDEPENDENT, operator-run service. The harness
# does not start/stop it — it only connects over HTTP at manager_url and degrades
# gracefully if it is down (ARCHITECTURE.md browser section §3.4). This compose
# file IS the bring-up mechanism (for the standalone path).
#
# Bring up (standalone path only):
#   1. docker/ensure-browser-network.sh              # create the mikuswarm-browser bridge
#   2. sudo MIKUSWARM_BROWSER_NETWORK=mikuswarm-browser \      # (hardening, root) block RFC1918
#        docker/browser-egress-rules.sh
#   3. BROWSER_AUTH_TOKEN=<token> \
#        docker compose -f docker/docker-compose.browser.yml up -d   # pulls the image
#
# The Manager binds 127.0.0.1:8080 only (localhost). Humans reach the noVNC GUI
# via SSH tunnel: ssh -L 8080:localhost:8080 your-host

services:
  manager:
    # Upstream's own published image, pinned by version tag — we neither fork nor
    # patch it, so there is nothing to build. Override MIKUSWARM_BROWSER_IMAGE to
    # track :latest (with Watchtower) or a different pin.
    image: ${MIKUSWARM_BROWSER_IMAGE:-cloakhq/cloakbrowser-manager:v0.0.10}
    container_name: ${MIKUSWARM_BROWSER_CONTAINER:-mikuswarm-cloakbrowser-manager}
    restart: unless-stopped
    init: true
    # Publish to loopback ONLY. The harness reaches REST + CDP-WS here; the bridge
    # (below) is the egress boundary, not this published port.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # When set, all /api/* routes (except /api/status, /api/auth/*) require
      # Authorization: Bearer <token>. The harness passes it on connectOverCDP.
      - AUTH_TOKEN=${BROWSER_AUTH_TOKEN:-}
    volumes:
      # Persistent "miku" identity: cookies, logins, prefs, fingerprint seed.
      # Defaults to a named volume; set MIKUSWARM_BROWSER_DATA_DIR to an ABSOLUTE host
      # path to bind-mount instead (compose does not expand ~ in bind paths).
      - ${MIKUSWARM_BROWSER_DATA_DIR:-mikuswarm-browser-data}:/data
      # Browser-download staging (ARCHITECTURE.md §11b): Chromium writes guid-named
      # downloads here ([browser] downloads_dir = "/downloads"); the host-side
      # agent sees the same dir at the bind source ([browser] downloads_local_dir
      # — default ../var/browser-downloads relative to this file, i.e. the project
      # var/ tree). Set MIKUSWARM_BROWSER_DOWNLOADS_DIR to an absolute host path to
      # relocate it; keep downloads_local_dir pointing at the same place.
      - ${MIKUSWARM_BROWSER_DOWNLOADS_DIR:-../var/browser-downloads}:/downloads
    networks:
      - mikuswarm-browser
    # Pin DNS to the same public resolvers the egress hardening permits
    # (PUBLIC_RESOLVERS in browser-egress-rules.sh, which DROPs RFC1918 and only
    # RETURNs DNS to these). Without this the container would inherit Docker's
    # embedded resolver → the host's (often RFC1918) DNS, bypassing the pinning
    # and reopening the DNS-tunnel-to-LAN exfil path the rules exist to close.
    # Keep this list in sync with PUBLIC_RESOLVERS. (Mirrors the dev sandbox.)
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # KasmVNC + a headed Chromium need shared memory; the default 64MB causes tab
    # crashes on heavy pages.
    shm_size: "1g"
    # Resource envelope: a headed Chromium + Xvfb + VNC ≈ ~512MB per running
    # profile (we run one). Budget a little headroom.
    mem_limit: ${MIKUSWARM_BROWSER_MEM:-1500m}
    cpus: ${MIKUSWARM_BROWSER_CPUS:-2}
    # Healthcheck is defined in the image (GET /api/status).

networks:
  # External: created and owned by docker/ensure-browser-network.sh so the egress
  # hardening (browser-egress-rules.sh) has a single, stable bridge to key its
  # iptables rules to. Reapply those rules after any network recreation.
  mikuswarm-browser:
    external: true
    name: ${MIKUSWARM_BROWSER_NETWORK:-mikuswarm-browser}

volumes:
  # Only used when MIKUSWARM_BROWSER_DATA_DIR is unset (the default). A bind path in
  # that env var takes precedence and this stays unused.
  mikuswarm-browser-data:
    name: ${MIKUSWARM_BROWSER_DATA_VOLUME:-mikuswarm-browser-data}
