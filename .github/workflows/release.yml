# Release — build and push MikuSwarm container images to GHCR, then publish a
# GitHub release whose notes are the matching CHANGELOG.md section.
#
# Fires ONLY on a pushed v* tag. There is no push/PR CI. Verification is NOT a
# separate job: it runs inside each image's
# Dockerfile builder stage (agent: `tsc --noEmit` + `npm test`; console:
# `svelte-check`), against the artifacts that stage already compiles. A failing
# check fails the build, so a broken commit is never pushed — the same gate as a
# standalone verify job, but without recompiling the Rust module a second time
# (GitHub Actions cache is per-git-ref: a tag release can't reuse another tag's
# cache, so the old verify-then-build split just paid for two ~20-min compiles).
#
# Images are published under the repository owner's namespace (no hardcoded user):
#   ghcr.io/<owner>/mikuswarm-agent
#   ghcr.io/<owner>/mikuswarm-console
#   ghcr.io/<owner>/mikuswarm-sandbox
#   ghcr.io/<owner>/mikuswarm-egress
#
# The CloakBrowser-Manager image is deliberately NOT built or published here — it
# is upstream's own published image (cloakhq/cloakbrowser-manager on Docker Hub),
# which we neither fork nor patch; the compose stack pulls it, pinned by tag.
#
# After every image is built and pushed, the `release` job publishes the GitHub
# release for the tag, with the body taken verbatim from the CHANGELOG.md section
# for that version (see scripts/changelog.py and RELEASING.md). It gates on the
# `images` job, so a version with a failed build never gets a release. The
# trigger is tag-push only: the release this workflow publishes must not turn
# around and trigger the workflow again.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Build & push the images. Verification runs INSIDE each Dockerfile builder
  # stage — the agent build runs `tsc --noEmit` + `npm test` against the native
  # module it already compiled; the console build runs `svelte-check`. A failure
  # fails the build, so a broken commit is never pushed — same gate as a separate
  # verify job, but WITHOUT a second ~20-min Rust compile (GitHub Actions cache is
  # per-git-ref, so a tag release could never reuse another tag's cache anyway).
  images:
    name: Build & push ${{ matrix.component }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: agent
            dockerfile: Dockerfile
            context: .
          - component: console
            dockerfile: console/Dockerfile
            context: ./console
          - component: sandbox
            dockerfile: docker/Dockerfile.sandbox
            context: ./docker
          - component: egress
            dockerfile: docker/Dockerfile.egress
            context: ./docker
    steps:
      - name: Checkout
        # No submodules: none of these images build the cloakbrowser-manager
        # submodule, so a recursive checkout is unnecessary.
        uses: actions/checkout@v7

      # The agent (multi-GB Rust compile + onnxruntime) and sandbox images
      # overflow the runner's ~14 GB free root disk mid-build. Reclaim the ~30 GB
      # of preinstalled toolchains this job never touches (no Node/dotnet/etc. is
      # used here — it only runs a Docker build).
      - name: Free up disk space
        if: matrix.component == 'agent' || matrix.component == 'sandbox'
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/boost || true
          echo "After:"; df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mikuswarm-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # amd64 only for now. arm64 can be added later, but the Rust/napi
          # cross-build cost for the agent image is unverified.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  # Publish the GitHub release once every image is built and pushed. The body is
  # the CHANGELOG.md section for this tag, extracted verbatim; `validate` first
  # fails the run on a malformed changelog, and `extract` fails if there is no
  # section for the tag — so a tag can never be released without its changelog
  # entry. changelog.py is standard-library-only, so a bare python3 runs it. A
  # generated "Container images" section is appended to the notes, because the
  # release's real artifacts are the GHCR images, not the source-code archives
  # GitHub attaches automatically — the release page must say where they are and
  # how to pull them.
  release:
    name: Publish GitHub release
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate changelog and confirm the release version matches the tag
        run: |
          set -euo pipefail
          python3 scripts/changelog.py validate
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          python3 scripts/changelog.py extract \
            --tag "${GITHUB_REF_NAME}" \
            --output release-notes.md

      # The images (agent/console/sandbox/egress) are pushed to GHCR by the
      # `images` job above; list them with a copy-paste pull for this tag so the
      # release documents its own deliverables. GHCR paths are lowercase, so the
      # owner is lowercased to match what the metadata action pushed under.
      - name: Append container image references
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            printf '\n## Container images\n\n'
            printf 'Published to GHCR for `%s`:\n\n' "$tag"
            printf '```\n'
            for component in agent console sandbox egress; do
              printf 'docker pull ghcr.io/%s/mikuswarm-%s:%s\n' "$owner" "$component" "$tag"
            done
            printf '```\n'
          } >> release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: false
