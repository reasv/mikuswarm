# Release — build and push MikuSwarm container images to GHCR.
#
# Fires ONLY on a pushed v* tag OR a published GitHub release. There is no
# push/PR CI. Verification is NOT a separate job: it runs inside each image's
# Dockerfile builder stage (agent: `tsc --noEmit` + `npm test`; console:
# `svelte-check`), against the artifacts that stage already compiles. A failing
# check fails the build, so a broken commit is never pushed — the same gate as a
# standalone verify job, but without recompiling the Rust module a second time
# (GitHub Actions cache is per-git-ref: a tag release can't reuse another tag's
# cache, so the old verify-then-build split just paid for two ~20-min compiles).
#
# Images are published under the repository owner's namespace (no hardcoded user):
#   ghcr.io/<owner>/mikuswarm-agent
#   ghcr.io/<owner>/mikuswarm-console
#   ghcr.io/<owner>/mikuswarm-sandbox
#   ghcr.io/<owner>/mikuswarm-egress
#
# The CloakBrowser-Manager image is deliberately NOT published here — it is an
# upstream submodule (vendor/cloakbrowser-manager, CloakHQ/CloakBrowser-Manager)
# and the compose stack builds it from that submodule directly.
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

# A tag push and a published-release for the same version both resolve to the
# same tag ref — dedupe so we don't build the images twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Build & push the images. Verification runs INSIDE each Dockerfile builder
  # stage — the agent build runs `tsc --noEmit` + `npm test` against the native
  # module it already compiled; the console build runs `svelte-check`. A failure
  # fails the build, so a broken commit is never pushed — same gate as a separate
  # verify job, but WITHOUT a second ~20-min Rust compile (GitHub Actions cache is
  # per-git-ref, so a tag release could never reuse another tag's cache anyway).
  images:
    name: Build & push ${{ matrix.component }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: agent
            dockerfile: Dockerfile
            context: .
          - component: console
            dockerfile: console/Dockerfile
            context: ./console
          - component: sandbox
            dockerfile: docker/Dockerfile.sandbox
            context: ./docker
          - component: egress
            dockerfile: docker/Dockerfile.egress
            context: ./docker
    steps:
      - name: Checkout
        # No submodules: none of these images build the cloakbrowser-manager
        # submodule, so a recursive checkout is unnecessary.
        uses: actions/checkout@v7

      # The agent (multi-GB Rust compile + onnxruntime) and sandbox images
      # overflow the runner's ~14 GB free root disk mid-build. Reclaim the ~30 GB
      # of preinstalled toolchains this job never touches (no Node/dotnet/etc. is
      # used here — it only runs a Docker build).
      - name: Free up disk space
        if: matrix.component == 'agent' || matrix.component == 'sandbox'
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/boost || true
          echo "After:"; df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mikuswarm-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # amd64 only for now. arm64 can be added later, but the Rust/napi
          # cross-build cost for the agent image is unverified.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
