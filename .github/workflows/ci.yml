# CI for MikuSwarm — type-check, native build, and unit tests on every push to
# master and every pull request. Mirrors the project's local commands:
#   build:native + fetch:tokenizer + tsc --noEmit + npm test
# The heavyweight Docker integration tests (test/**/*.docker.test.ts) are NOT
# run here — they need a sandbox image and a daemon.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent (type-check + native build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # No submodules: the cloakbrowser-manager submodule is only used by the
        # browser image build, not by the unit tests.
        uses: actions/checkout@v4

      - name: Install ripgrep
        # The workspace search/memory tools spawn `rg`; the unit tests exercise
        # that path, so ripgrep must be on PATH (not preinstalled on the runner).
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Setup Node 24 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # Pin pnpm to packageManager in package.json via corepack.
      - name: Enable corepack (pnpm@10.11.0)
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Setup Rust (pinned to rust-toolchain.toml)
        # rust-toolchain.toml pins channel 1.93.0; the action reads it.
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Cache cargo + Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native module
        run: pnpm build:native

      - name: Fetch GLM tokenizer
        # Checksum-verified download; needs network.
        run: pnpm fetch:tokenizer

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  console:
    name: Console (type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (pnpm@10.11.0)
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-console-${{ hashFiles('console/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-console-

      - name: Install dependencies
        # Skip the playwright browser download — the svelte-check/build path does
        # not need it (vitest browser tests are not run in CI).
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Type-check (svelte-check)
        run: pnpm check

      - name: Build
        run: pnpm build
