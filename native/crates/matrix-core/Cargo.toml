[package]
name = "openclaw-matrix-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["clock", "serde"] }
emojis = "0.8.0"
futures-util = "0.3.32"
matrix-sdk = { version = "0.16.0", default-features = false, features = ["bundled-sqlite", "e2e-encryption", "sqlite", "rustls-tls"] }
mime = "0.3.17"
napi = { version = "2.16.17", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "2.16.13"
regex = "1.11.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
# GLM-native tokenizer (spec/TOKENIZER-SWAP.md §5.2). Inference only — `onig` is
# HF's reference pretokenizer-regex backend (parity with the model's published
# tokenizer.json); `progressbar`/`esaxx_fast`/`http` are training/download extras we
# don't need. Built under the debug/napi profile, so an `opt-level` override in
# native/Cargo.toml keeps this BPE loop fast (§5.2 build caveat).
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }

[build-dependencies]
napi-build = "2.1.5"

[dev-dependencies]
wiremock = "0.6.5"
